name: Fog Forecast

on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fog model
        timeout-minutes: 12
        # Флаговете на еталона v26-env-near (CSI 0.4019). D2_SOIL е "0"
        # по подразбиране в fog_model.py — без този ред оперативният
        # модел върви с изключена почвена схема.
        env:
          D1_DOOR: "0"
          D2_SOIL: "1"
          D2_SOIL_MAX_KHR: "0.5"
        run: python run_operational.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Forecast update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push
